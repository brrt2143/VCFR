[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcfr-reader-companion"
version = "0.1.0"
description = "Local voice commands and reading notes for ebook readers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["requests>=2.31,<3", "vosk==0.3.45"]

[project.optional-dependencies]
video = ["faster-whisper>=1.0,<2"]
video-online = ["faster-whisper>=1.0,<2", "yt-dlp>=2024.1.0"]

[project.scripts]
vcfr = "vcfr.app:main"

[tool.setuptools]
packages = ["vcfr"]
